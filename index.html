<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Netflix</title>
    <link rel="stylesheet" href="src/css/reset.css">
    <link rel="stylesheet" href="./src/css/global.css">
    <link rel="stylesheet" href="src/css/page.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/7.3.1/css/all.min.css" integrity="sha512-QeR2VH+lsBE5LSAe1Q5EnTBbe7XTBubt8dG93Y7gidSgdMCr8nVqKcfKAMyN96SV8KDbZVTDXChatu5G2KQGzg==" crossorigin="anonymous" referrerpolicy="no-referrer">
</head>
<body>
    <div class="app__background">
        <header class="navbar">
            <ul class="navbar-list">
                <img src="src/imagens/logo 1.png" alt="" class="navbar__logo">
                <li class="navbar-list__item"><a href="#">Inicio</a></li>
                <li class="navbar-list__item"><a href="#">Séries</a></li>
                <li class="navbar-list__item"><a href="#">Bombando</a></li>
                <li class="navbar-list__item"><a href="#">Minha lista</a></li>
            </ul>
            <div class="navbar-user">
                <i class="fa-solid fa-magnifying-glass"></i>
                <i class="fa-solid fa-bell"></i>
                <img src="src/imagens/user 1.png" alt="" class="navbar__avatar-user">
            </div>
        </header>
        <main>
            <section class="hero">
                <div class="hero__container">
                    <img src="src/imagens/poster 1.png" alt="Título da série" class="hero__title-series">
                    <p class="hero__description">Em uma penitenciária de ultima geração, um detento participa de um experimento com drogas que controlam as emoções para um gênio da industria farmacêutica.</p>
                    <div class="hero__cta">
                        <button class="btn__primary"><a href="#"><i class="fa-solid fa-play"></i>Assistir</a></button>
                        <button class="btn__secondary"><a href="#"><i class="fa-solid fa-circle-info"></i>Mais informações</a></button>
                    </div>
                </div>
            </section>
            <section class="lista-series">
                <div class="lista-series__container">
                    <p class="lista-series__title">Minha Lista</p>
                    <div class="lista-series__content">
                        <div class="lista-series__item">
                            <img src="src/imagens/bojack_horseman_minha-lista.png" alt="Bojack Horseman">
                        </div>
                        <div class="lista-series__item">
                            <img src="src/imagens/ozark_minha-lista.png" alt="Ozark">
                        </div>
                        <div class="lista-series__item">
                            <img src="src/imagens/a_vizinha_da_mulher_minha-lista.png" alt="A vizinha da mulher na janela">
                        </div>
                        <div class="lista-series__item">
                            <img src="src/imagens/breaking_bad_minha-lista.png" alt="Breaking Bad">
                        </div>
                        <div class="lista-series__item">
                            <img src="src/imagens/the_end_of_the_world_minha-lista.png" alt="The end of the f***ing world">
                        </div>
                        <div class="lista-series__item">
                            <img src="src/imagens/boneca_russa_minha-lista.png" alt="Boneca Russa">
                        </div>
                        <div class="lista-series__item">
                            <img src="src/imagens/pray_away_minha-lista.png" alt="Pray Away">
                        </div>
                    </div>
                </div>
            </section>
            <section class="lista-series">
                <div class="lista-series__container">
                    <p class="lista-series__title">Em alta</p>
                    <div class="lista-series__content">
                        <div class="lista-series__item">
                            <img src="src/imagens/stranger_things_series.png" alt="Stranger Things">
                        </div>
                        <div class="lista-series__item">
                            <img src="src/imagens/the_umbrella_academy_series.png" alt="The Umbrella Academy">
                        </div>
                        <div class="lista-series__item">
                            <img src="src/imagens/peaky_blinders_series.png" alt="Peaky Blinders">
                        </div>
                        <div class="lista-series__item">
                            <img src="src/imagens/arremesando_alto_series.png" alt="Aremessando Alto">
                        </div>
                        <div class="lista-series__item">
                            <img src="src/imagens/amor_e_gelado_series.png" alt="Amor e Gelado">
                        </div>
                        <div class="lista-series__item">
                            <img src="src/imagens/la_casa_de_papel_series.png" alt="La casa de papel">
                        </div>
                        <div class="lista-series__item">
                            <img src="src/imagens/polar_series.png" alt="Polar">
                        </div>
                    </div>
                </div>
            </section>
            <section  class="lista-series">
                <div class="lista-series__container">
                    <p class="lista-series__title">Séries Estrangeiras</p>
                    <div class="lista-series__content">
                        <div class="lista-series__item">
                            <img src="src/imagens/queen_loretta-series.png" alt="Queen Loretta">
                        </div>
                        <div class="lista-series__item">
                            <img src="src/imagens/as_7_vidas_de_lea-series.png" alt="As 7 Vidas de Lea">
                        </div>
                        <div class="lista-series__item">
                            <img src="src/imagens/young_royals-series.png" alt="Young Royals">
                        </div>
                        <div class="lista-series__item">
                            <img src="src/imagens/dark-series.png" alt="Dark">
                        </div>
                        <div class="lista-series__item">
                            <img src="src/imagens/bem_vindo_ao_eden-series.png" alt="Bem Vindo ao Eden">
                        </div>
                        <div class="lista-series__item">
                            <img src="src/imagens/ozark2-series.png" alt="Ozark">
                        </div>
                        <div class="lista-series__item">
                            <img src="src/imagens/elize_matsunaga-series.png" alt="Elize Matsunaga - Era uma vez um crime">
                        </div>
                    </div>
                </div>
            </section>
            <section  class="lista-series-slide">
                <div class="lista-series__container">
                    <p class="lista-series__title">Você pode gostar</p>
                    <button class="btn-next"><i class="fa-solid fa-arrow-left"></i></button>
                    <div class="lista-series__content">
                        <div class="lista-series__item">
                            <img src="src/imagens/the_bundy_tapes-series.png" alt="Conversarion with a killer-Ted Bundy Tapes">
                        </div>
                        <div class="lista-series__item">
                            <img src="src/imagens/gabriel_fluffy-series.png" alt="Gabriel Fluffy Inglesias">
                        </div>
                        <div class="lista-series__item">
                            <img src="src/imagens/fyre-series.png" alt="Fyre- The greatest party that never happened">
                        </div>
                        <div class="lista-series__item">
                            <img src="src/imagens/friends_from_college-series.png" alt="Friends from college">
                        </div>
                        <div class="lista-series__item">
                            <img src="src/imagens/riverdale-series.png" alt="Riverdale">
                        </div>
                        <div class="lista-series__item">
                            <img src="src/imagens/velvet_buzzsau-series.png" alt="Velvet Buzzsau">
                        </div>
                        <div class="lista-series__item">
                            <img src="src/imagens/amazing_interiors_series.png" alt="Amazing Interiors">
                        </div>
                        <div class="lista-series__item">
                            <img src="src/imagens/the_good_place-series.png" alt="the Good Place">
                        </div>
                        <div class="lista-series__item">
                            <img src="src/imagens/un_break_able-series.png" alt="UnBreakAble">
                        </div>
                        <div class="lista-series__item">
                            <img src="src/imagens/bojack_horseman_minha-lista.png" alt="Bojack Horseman">
                        </div>
                        <div class="lista-series__item">
                            <img src="src/imagens/ozark_minha-lista.png" alt="Ozark">
                        </div>
                    </div>
                    <button class="btn-prev"><i class="fa-solid fa-arrow-right"></i></button>
                </div>
            </section>
        </main>
        <footer>
        </footer>
    </div>
</body>
</html>
