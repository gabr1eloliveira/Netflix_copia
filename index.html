<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Netflix</title>
    <link rel="stylesheet" href="src/css/reset.css">
    <link rel="stylesheet" href="./src/css/global.css">
    <link rel="stylesheet" href="src/css/page.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/7.3.1/css/all.min.css" integrity="sha512-QeR2VH+lsBE5LSAe1Q5EnTBbe7XTBubt8dG93Y7gidSgdMCr8nVqKcfKAMyN96SV8KDbZVTDXChatu5G2KQGzg==" crossorigin="anonymous" referrerpolicy="no-referrer">
</head>
<body>
    <div class="app__background">
        <header class="navbar">
            <ul class="navbar-list">
                <img src="src/imagens/logo 1.png" alt="" class="navbar__logo">
                <li class="navbar-list__item"><a href="#">Inicio</a></li>
                <li class="navbar-list__item"><a href="#">Séries</a></li>
                <li class="navbar-list__item"><a href="#">Bombando</a></li>
                <li class="navbar-list__item"><a href="#">Minha lista</a></li>
            </ul>
            <div class="navbar-user">
                <i class="fa-solid fa-magnifying-glass"></i>
                <i class="fa-solid fa-bell"></i>
                <img src="src/imagens/user 1.png" alt="" class="navbar__avatar-user">
            </div>
        </header>
        <main>
            <section class="hero">
                <div class="hero__container">
                    <img src="src/imagens/poster 1.png" alt="Título da série" class="hero__title-series">
                    <p class="hero__description">Em uma penitenciária de ultima geração, um detento participa de um experimento com drogas que controlam as emoções para um gênio da industria farmacêutica.</p>
                    <div class="hero__cta">
                        <button class="btn__primary"><a href="#"><i class="fa-solid fa-play"></i>Assistir</a></button>
                        <button class="btn__secondary"><a href="#"><i class="fa-solid fa-circle-info"></i>Mais informações</a></button>
                    </div>
                </div>
            </section>
            <section class="minha-lista">
                <div class="minha-lista__container">
                    <p class="minha-lista__subtitle">Minha Lista</p>
                    <img src="src/imagens/Trilho Minha Lista.png" alt="" class="minha-lista__series">
                </div>
            </section>
        </main>
        <footer>
        </footer>
    </div>
</body>
</html>
